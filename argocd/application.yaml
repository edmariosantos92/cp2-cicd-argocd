apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cp2-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/edmariosantos92/cp2-cicd-argocd.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: cp2-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
